<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 910" width="1100" height="910" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Algorytm proponowany: materiał przechodzi przez trzy kanały cech (tekst z maskowaniem encji, obraz, infrastruktura), podobieństwo do kampanii to ważona suma z wagą rzadkości liczona tylko po dostępnych cechach, a próg każdej kampanii jest kalibrowany offline na wariantach z LLM.">
  <title>Algorytm proponowany: podobieństwo wielokanałowe z kalibracją</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1100" height="910" fill="#ffffff"/>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a">Propozycja: podobieństwo wielokanałowe z progiem kalibrowanym per kampania</text>

  <!-- wejscie -->
  <rect x="400" y="60" width="300" height="48" rx="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="550" y="80" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">Materiał X</text>
  <text x="550" y="98" font-size="11" fill="#0c4a6e" text-anchor="middle">URL · zrzut ekranu · plik · tekst</text>

  <!-- rozgalezienie -->
  <line x1="550" y1="108" x2="550" y2="126" stroke="#334155" stroke-width="1.5"/>
  <line x1="200" y1="126" x2="900" y2="126" stroke="#334155" stroke-width="1.5"/>
  <line x1="200" y1="126" x2="200" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="126" x2="550" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="126" x2="900" y2="146" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== kanal TEKST ===== -->
  <rect x="40" y="148" width="320" height="244" rx="12" fill="#f1f5f9"/>
  <text x="60" y="172" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">TEKST</text>
  <rect x="60" y="186" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="200" y="209" font-size="12" fill="#0f172a" text-anchor="middle">OCR / tekst z HTML strony</text>
  <line x1="200" y1="222" x2="200" y2="234" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="60" y="236" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="200" y="259" font-size="12" fill="#0f172a" text-anchor="middle">NER: osoby, marki, kwoty, produkty</text>
  <line x1="165" y1="272" x2="138" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="245" y1="272" x2="275" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="60" y="290" width="150" height="82" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="135" y="311" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">szablon</text>
  <text x="135" y="328" font-size="11" fill="#0f172a" text-anchor="middle">[OSOBA] radzi, jak</text>
  <text x="135" y="343" font-size="11" fill="#0f172a" text-anchor="middle">zarobić [KWOTA]</text>
  <text x="135" y="362" font-size="11" fill="#475569" text-anchor="middle">→ embedding</text>
  <rect x="220" y="290" width="120" height="82" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="280" y="311" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">encje</text>
  <text x="280" y="328" font-size="11" fill="#0f172a" text-anchor="middle">osoba, marka,</text>
  <text x="280" y="343" font-size="11" fill="#0f172a" text-anchor="middle">kwota, produkt</text>
  <text x="280" y="362" font-size="11" fill="#475569" text-anchor="middle">→ osobne cechy</text>

  <!-- ===== kanal OBRAZ ===== -->
  <rect x="390" y="148" width="320" height="244" rx="12" fill="#f1f5f9"/>
  <text x="410" y="172" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">OBRAZ</text>
  <rect x="410" y="186" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="550" y="209" font-size="12" fill="#0f172a" text-anchor="middle">pHash → duplikaty obrazu</text>
  <rect x="410" y="232" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="550" y="255" font-size="12" fill="#0f172a" text-anchor="middle">CLIP → podobny szablon wizualny</text>
  <rect x="410" y="278" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="550" y="301" font-size="12" fill="#0f172a" text-anchor="middle">twarz → baza referencyjna osób</text>
  <rect x="410" y="324" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="550" y="347" font-size="12" fill="#0f172a" text-anchor="middle">logo → marka / podszywanie</text>

  <!-- ===== kanal INFRASTRUKTURA ===== -->
  <rect x="740" y="148" width="320" height="244" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="760" y="172" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1">INFRASTRUKTURA</text>
  <text x="1040" y="172" font-size="11" fill="#0f766e" text-anchor="end">najsilniejsze ślady</text>
  <rect x="760" y="186" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="900" y="209" font-size="12" fill="#0f172a" text-anchor="middle">crawl: przekierowania, finalna domena</text>
  <rect x="760" y="232" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="900" y="255" font-size="12" fill="#0f172a" text-anchor="middle">RDAP/WHOIS, DNS, IP/ASN, crt.sh</text>
  <rect x="760" y="278" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="900" y="301" font-size="12" fill="#0f172a" text-anchor="middle">GA / GTM / Pixel ID, favicon hash</text>
  <rect x="760" y="324" width="280" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="900" y="347" font-size="12" fill="#0f172a" text-anchor="middle">hash struktury DOM, zestaw skryptów</text>

  <!-- zbieg kanalow -->
  <line x1="200" y1="392" x2="200" y2="412" stroke="#334155" stroke-width="1.5"/>
  <line x1="550" y1="392" x2="550" y2="412" stroke="#334155" stroke-width="1.5"/>
  <line x1="900" y1="392" x2="900" y2="412" stroke="#334155" stroke-width="1.5"/>
  <line x1="200" y1="412" x2="900" y2="412" stroke="#334155" stroke-width="1.5"/>
  <line x1="550" y1="412" x2="550" y2="438" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- profil -->
  <rect x="330" y="440" width="440" height="48" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="460" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Profil materiału</text>
  <text x="550" y="478" font-size="11" fill="#475569" text-anchor="middle">cechy typowane; brak danych = null, nie zero</text>

  <line x1="550" y1="488" x2="550" y2="518" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- score -->
  <rect x="300" y="520" width="500" height="86" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="550" y="542" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Podobieństwo do kampanii K</text>
  <text x="550" y="564" font-size="13" fill="#0f172a" text-anchor="middle">score = Σ w<tspan baseline-shift="sub" font-size="9">i</tspan> · sim<tspan baseline-shift="sub" font-size="9">i</tspan> · rzadkość<tspan baseline-shift="sub" font-size="9">i</tspan>  /  Σ w<tspan baseline-shift="sub" font-size="9">i</tspan></text>
  <text x="550" y="582" font-size="11" fill="#475569" text-anchor="middle">suma tylko po cechach dostępnych w obu materiałach</text>
  <text x="550" y="598" font-size="11" font-style="italic" fill="#475569" text-anchor="middle">rzadki GA-ID ≫ wspólny IP Cloudflare</text>

  <!-- baza kampanii -->
  <path d="M860,536 a100,8 0 0,0 200,0 a100,8 0 0,0 -200,0 v50 a100,8 0 0,0 200,0 v-50" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="960" y="570" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Baza kampanii</text>
  <line x1="858" y1="563" x2="804" y2="563" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="831" y="556" font-size="11" fill="#475569" text-anchor="middle">kNN</text>

  <line x1="550" y1="606" x2="550" y2="628" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- decyzja -->
  <polygon points="550,630 660,675 550,720 440,675" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="680" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">score ≥ próg<tspan baseline-shift="sub" font-size="9">K</tspan> ?</text>

  <!-- TAK -->
  <line x1="550" y1="720" x2="550" y2="758" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="558" y="744" font-size="11" font-weight="700" fill="#15803d">TAK</text>
  <rect x="390" y="760" width="320" height="76" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="550" y="782" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Przypisz do kampanii K</text>
  <text x="550" y="801" font-size="11" fill="#14532d" text-anchor="middle">przesłanki: wspólny GA-ID (0,9),</text>
  <text x="550" y="817" font-size="11" fill="#14532d" text-anchor="middle">ten sam szablon (0,87), osoba X</text>

  <!-- NIE -->
  <path d="M660,675 H900 V758" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="680" y="667" font-size="11" font-weight="700" fill="#b91c1c">NIE</text>
  <rect x="780" y="760" width="280" height="76" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="920" y="782" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">Nowa kampania</text>
  <text x="920" y="801" font-size="11" fill="#7f1d1d" text-anchor="middle">status: niepotwierdzona</text>
  <text x="920" y="817" font-size="11" fill="#7f1d1d" text-anchor="middle">kotwicą zostaje po weryfikacji</text>
  <line x1="1045" y1="760" x2="1045" y2="596" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1052" y="690" font-size="11" fill="#475569">dodaj</text>

  <!-- ===== kalibracja ===== -->
  <rect x="30" y="470" width="240" height="250" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="492" font-size="12" font-weight="700" fill="#166534" letter-spacing="0.6">KALIBRACJA · offline</text>
  <text x="46" y="508" font-size="11" fill="#166534">tu trafia Twój pomysł z wariantami</text>
  <rect x="46" y="520" width="208" height="58" rx="6" fill="#fef3c7" stroke="#b45309"/>
  <text x="150" y="539" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Warianty z LLM</text>
  <text x="150" y="555" font-size="11" fill="#78350f" text-anchor="middle">parafraza, skrót, tłumaczenie,</text>
  <text x="150" y="570" font-size="11" fill="#78350f" text-anchor="middle">inna osoba lub produkt</text>
  <line x1="150" y1="578" x2="150" y2="592" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="46" y="594" width="208" height="44" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="150" y="612" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">zbiór walidacyjny</text>
  <text x="150" y="628" font-size="11" fill="#0f172a" text-anchor="middle">+ leave-one-campaign-out</text>
  <line x1="150" y1="638" x2="150" y2="652" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="46" y="654" width="208" height="52" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="150" y="674" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">wagi w<tspan baseline-shift="sub" font-size="9">i</tspan>, próg<tspan baseline-shift="sub" font-size="9">K</tspan></text>
  <text x="150" y="694" font-size="12" fill="#14532d" text-anchor="middle">próg<tspan baseline-shift="sub" font-size="9">K</tspan> = μ<tspan baseline-shift="sub" font-size="9">K</tspan> − k·σ<tspan baseline-shift="sub" font-size="9">K</tspan></text>

  <!-- kalibracja -> score / decyzja -->
  <path d="M254,666 H320 V610" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrGreen)"/>
  <text x="287" y="660" font-size="11" fill="#166534" text-anchor="middle">wagi</text>
  <line x1="254" y1="694" x2="484" y2="694" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrGreen)"/>
  <text x="370" y="688" font-size="11" fill="#166534" text-anchor="middle">próg<tspan baseline-shift="sub" font-size="8">K</tspan></text>

  <!-- ===== legenda ===== -->
  <rect x="40" y="862" width="14" height="14" rx="3" fill="#fef3c7" stroke="#b45309"/>
  <text x="62" y="874" font-size="12" fill="#0f172a">LLM: tylko offline, poza ścieżką decyzji</text>
  <rect x="420" y="862" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-dasharray="3 2"/>
  <text x="442" y="874" font-size="12" fill="#0f172a">kalibracja: Twój pomysł z wariantami, przeniesiony z bazy do walidacji</text>
  <rect x="40" y="886" width="14" height="14" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="62" y="898" font-size="12" fill="#0f172a">infrastruktura: kanał nieobecny w obecnym algorytmie</text>
  <rect x="420" y="886" width="14" height="14" rx="3" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="442" y="898" font-size="12" fill="#0f172a">nowa kampania nie staje się od razu kotwicą (rozwiązuje problem 4)</text>
</svg>

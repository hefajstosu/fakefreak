<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="1100" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Algorytm obecny: dla każdego pewnego fake'a LLM generuje n wariantów (grupa testowa), a nowy artykuł jest przypisywany do kampanii, gdy jego podobieństwo do grupy jest bliskie podobieństwu oryginału do tej grupy. Zaznaczono sześć problemów.">
  <title>Algorytm obecny: grupa testowa z wariantów LLM</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1100" height="900" fill="#ffffff"/>
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a">Algorytm obecny: grupa testowa z wariantów generowanych przez LLM</text>

  <!-- ===== panele ===== -->
  <rect x="20" y="60" width="500" height="650" rx="12" fill="#f1f5f9"/>
  <text x="40" y="88" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.6">FAZA OFFLINE · raz dla każdego pewnego fake'a</text>
  <rect x="580" y="60" width="500" height="650" rx="12" fill="#f1f5f9"/>
  <text x="600" y="88" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.6">FAZA ONLINE · dla każdego nowego artykułu</text>

  <!-- ===== OFFLINE ===== -->
  <!-- baza pewnych fake'ow -->
  <path d="M100,118 a170,10 0 0,0 340,0 a170,10 0 0,0 -340,0 v42 a170,10 0 0,0 340,0 v-42" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="150" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Baza pewnych fake'ów</text>

  <line x1="270" y1="172" x2="270" y2="203" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="192" font-size="11" fill="#475569">weź fake F</text>

  <!-- LLM #1 -->
  <rect x="100" y="205" width="340" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="270" y="228" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">LLM #1</text>
  <text x="270" y="248" font-size="12" fill="#78350f" text-anchor="middle">zaproponuj n parametrów do zmiany</text>
  <text x="448" y="238" font-size="11" fill="#64748b">n — z badań</text>

  <line x1="270" y1="261" x2="270" y2="303" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="286" font-size="11" fill="#475569">P = {p<tspan baseline-shift="sub" font-size="8">1</tspan> … p<tspan baseline-shift="sub" font-size="8">n</tspan>}  np. osoba, marka auta</text>

  <!-- LLM #2 -->
  <rect x="100" y="305" width="340" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="270" y="328" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">LLM #2</text>
  <text x="270" y="348" font-size="12" fill="#78350f" text-anchor="middle">wygeneruj n wariantów F z podmienionym p<tspan baseline-shift="sub" font-size="8">i</tspan></text>
  <circle cx="440" cy="305" r="11" fill="#dc2626"/>
  <text x="440" y="309.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>

  <line x1="270" y1="361" x2="270" y2="403" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="386" font-size="11" fill="#475569">grupa testowa G<tspan baseline-shift="sub" font-size="8">F</tspan> = {V<tspan baseline-shift="sub" font-size="8">1</tspan> … V<tspan baseline-shift="sub" font-size="8">n</tspan>}</text>

  <!-- embeddingi -->
  <rect x="100" y="405" width="340" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="433" font-size="13" fill="#0f172a" text-anchor="middle">Embeddingi F oraz G<tspan baseline-shift="sub" font-size="9">F</tspan></text>

  <line x1="270" y1="451" x2="270" y2="493" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ref_F -->
  <rect x="100" y="495" width="340" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="523" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">ref<tspan baseline-shift="sub" font-size="9">F</tspan> = sim(F, G<tspan baseline-shift="sub" font-size="9">F</tspan>)</text>
  <circle cx="440" cy="495" r="11" fill="#dc2626"/>
  <text x="440" y="499.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <line x1="270" y1="541" x2="270" y2="586" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="568" font-size="11" fill="#475569">zapis (F, G<tspan baseline-shift="sub" font-size="8">F</tspan>, ref<tspan baseline-shift="sub" font-size="8">F</tspan>)</text>

  <!-- indeks -->
  <path d="M100,598 a170,10 0 0,0 340,0 a170,10 0 0,0 -340,0 v52 a170,10 0 0,0 340,0 v-52" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="634" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Indeks grup testowych</text>

  <!-- ===== ONLINE ===== -->
  <rect x="660" y="110" width="340" height="46" rx="23" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="830" y="138" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">Nowy artykuł X</text>

  <line x1="830" y1="156" x2="830" y2="198" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="660" y="200" width="340" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="830" y="228" font-size="13" fill="#0f172a" text-anchor="middle">Embedding X</text>

  <line x1="830" y1="246" x2="830" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="660" y="290" width="340" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="830" y="313" font-size="12" fill="#475569" text-anchor="middle">dla każdego F w indeksie</text>
  <text x="830" y="334" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">s<tspan baseline-shift="sub" font-size="9">F</tspan> = sim(X, G<tspan baseline-shift="sub" font-size="9">F</tspan>)</text>
  <circle cx="1000" cy="290" r="11" fill="#dc2626"/>
  <text x="1000" y="294.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <!-- indeks -> porownanie -->
  <path d="M440,622 H550 V318 H656" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="603" y="310" font-size="11" fill="#475569" text-anchor="middle">odczyt G<tspan baseline-shift="sub" font-size="8">F</tspan>, ref<tspan baseline-shift="sub" font-size="8">F</tspan></text>

  <line x1="830" y1="346" x2="830" y2="388" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="660" y="390" width="340" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="830" y="413" font-size="12" fill="#475569" text-anchor="middle">porównaj z poziomem odniesienia</text>
  <text x="830" y="434" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">r<tspan baseline-shift="sub" font-size="9">F</tspan> = s<tspan baseline-shift="sub" font-size="9">F</tspan> / ref<tspan baseline-shift="sub" font-size="9">F</tspan></text>
  <circle cx="1000" cy="390" r="11" fill="#dc2626"/>
  <text x="1000" y="394.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <line x1="830" y1="446" x2="830" y2="478" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- decyzja -->
  <polygon points="830,480 930,525 830,570 730,525" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="830" y="530" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">r<tspan baseline-shift="sub" font-size="9">F</tspan> ≥ τ ?</text>
  <circle cx="948" cy="497" r="11" fill="#dc2626"/>
  <text x="948" y="501.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- TAK -->
  <path d="M730,525 H695 V598" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="712" y="517" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">TAK</text>
  <rect x="600" y="600" width="190" height="56" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="695" y="623" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">X ∈ kampania F</text>
  <text x="695" y="643" font-size="12" fill="#14532d" text-anchor="middle">kilka F → nakładanie</text>

  <!-- NIE -->
  <path d="M930,525 H965 V598" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="950" y="517" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">NIE</text>
  <rect x="870" y="600" width="190" height="56" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="965" y="623" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle">nowa kampania</text>
  <text x="965" y="643" font-size="12" fill="#7f1d1d" text-anchor="middle">X staje się nowym F</text>
  <circle cx="1060" cy="600" r="11" fill="#dc2626"/>
  <text x="1060" y="604.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- petla powrotna -->
  <path d="M965,656 V740 H50 V138 H96" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="507" y="733" font-size="11" fill="#b91c1c" text-anchor="middle">wraca do fazy offline jako niezweryfikowana kotwica</text>

  <!-- ===== legenda problemow ===== -->
  <text x="40" y="786" font-size="13" font-weight="700" fill="#0f172a">Problemy oznaczone na schemacie</text>

  <circle cx="51" cy="812" r="10" fill="#dc2626"/>
  <text x="51" y="816" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="70" y="816" font-size="12" fill="#0f172a">agregacja sim(X, G<tspan baseline-shift="sub" font-size="8">F</tspan>) nieokreślona: średnia, max czy centroid?</text>

  <circle cx="51" cy="838" r="10" fill="#dc2626"/>
  <text x="51" y="842" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="70" y="842" font-size="12" fill="#0f172a">ref<tspan baseline-shift="sub" font-size="8">F</tspan> ≈ 0,95+, bo warianty to prawie kopie F → próg za wysoki</text>

  <circle cx="51" cy="864" r="10" fill="#dc2626"/>
  <text x="51" y="868" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="70" y="868" font-size="12" fill="#0f172a">brak procedury doboru progu τ</text>

  <circle cx="571" cy="812" r="10" fill="#dc2626"/>
  <text x="571" y="816" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="590" y="816" font-size="12" fill="#0f172a">dryf: niezweryfikowany X staje się kotwicą i przyciąga kolejne</text>

  <circle cx="571" cy="838" r="10" fill="#dc2626"/>
  <text x="571" y="842" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="590" y="842" font-size="12" fill="#0f172a">LLM może odmówić generowania scamu z prawdziwą osobą</text>

  <circle cx="571" cy="864" r="10" fill="#64748b"/>
  <text x="571" y="868" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="590" y="868" font-size="12" fill="#0f172a">cały algorytm widzi tylko tekst: brak obrazu i infrastruktury</text>
</svg>
